<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .float-a { animation: floatA 9s ease-in-out infinite; }
    .float-b { animation: floatB 11s ease-in-out infinite; }
    .cursor  { animation: blink 1.1s steps(1) infinite; }
    .pulse   { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    .title   { animation: glow 6s ease-in-out infinite; }
    @keyframes floatA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-28px,18px); } }
    @keyframes floatB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(24px,-14px); } }
    @keyframes blink  { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes pulse  { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes glow   { 0%,100% { opacity: 1; } 50% { opacity: .82; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f2a"/>
      <stop offset="1" stop-color="#1c1452"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7d774"/>
      <stop offset="0.5" stop-color="#a8e6a1"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle class="float-a" cx="1090" cy="30" r="200" fill="#3b2f9e" opacity="0.55"/>
    <circle class="float-b" cx="150" cy="350" r="150" fill="#14506b" opacity="0.55"/>
  </g>

  <text x="74" y="86" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="22" letter-spacing="3" fill="#5eead4">$ python -m ingestion.runner</text>
  <rect class="cursor" x="506" y="68" width="12" height="22" fill="#5eead4"/>

  <text x="70" y="160" font-family="'Arial Black', 'Segoe UI Black', Arial, 'Liberation Sans', sans-serif" font-weight="900" font-size="50" fill="url(#title)" class="title">Config-Driven Data Pipeline</text>

  <text x="74" y="208" font-family="'Segoe UI', Arial, 'Liberation Sans', sans-serif" font-size="26" fill="#c9cfe6">Add data sources with YAML, not code.</text>

  <g transform="translate(700 228)">
    <rect width="440" height="88" rx="16" fill="#0b0f2a" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.12"/>
    <g font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="18">
      <text x="24" y="36" fill="#9aa3c7">status</text>
      <circle class="pulse" cx="112" cy="30" r="5" fill="#5eead4"/>
      <circle cx="112" cy="30" r="5" fill="#5eead4"/>
      <text x="124" y="36" fill="#5eead4">building</text>
      <text x="24" y="66" fill="#9aa3c7">layers</text>
      <text x="104" y="66" fill="#f5a54a">bronze</text>
      <text x="176" y="66" fill="#9aa3c7">→</text>
      <text x="198" y="66" fill="#e8edf3">silver</text>
      <text x="270" y="66" fill="#9aa3c7">→</text>
      <text x="292" y="66" fill="#f7d774">gold</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
