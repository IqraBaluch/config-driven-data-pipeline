<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .ring  { transform-box: fill-box; transform-origin: center; animation: ring 2.2s ease-out infinite; }
    .track { stroke-dasharray: 10 8; animation: flow 1s linear infinite; }
    .goal  { animation: goal 3s ease-in-out infinite; }
    @keyframes ring { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.45); opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @keyframes goal { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f2a"/>
      <stop offset="1" stop-color="#151040"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="230" rx="24" fill="url(#bg)"/>
  <text x="600" y="46" text-anchor="middle" font-family="'Segoe UI', Arial, 'Liberation Sans', sans-serif" font-weight="700" font-size="26" fill="#ffffff">The build</text>

  <!-- track -->
  <line x1="140" y1="112" x2="1060" y2="112" stroke="#3a3f63" stroke-width="5"/>
  <line x1="140" y1="112" x2="255" y2="112" stroke="#f5a54a" stroke-width="5"/>
  <line class="track" x1="255" y1="112" x2="340" y2="112" stroke="#f5a54a" stroke-opacity="0.6" stroke-width="5"/>

  <g font-family="'Segoe UI', Arial, 'Liberation Sans', sans-serif" text-anchor="middle">
    <!-- 1 Ingestion: in progress -->
    <circle cx="140" cy="112" r="44" fill="none" stroke="#f5a54a" stroke-opacity="0.35" stroke-width="8"/>
    <circle class="ring" cx="140" cy="112" r="32" fill="none" stroke="#f5a54a" stroke-width="4"/>
    <circle cx="140" cy="112" r="32" fill="#f5a54a"/>
    <text x="140" y="122" font-size="28" font-weight="800" fill="#1a1440">1</text>
    <text x="140" y="186" font-size="22" font-weight="700" fill="#ffffff">Ingestion</text>
    <text x="140" y="210" font-size="15" fill="#f5a54a">in progress</text>

    <!-- 2 Transform -->
    <circle cx="370" cy="112" r="30" fill="#151040" stroke="#9aa3c7" stroke-width="3"/>
    <text x="370" y="122" font-size="26" font-weight="700" fill="#9aa3c7">2</text>
    <text x="370" y="186" font-size="22" font-weight="700" fill="#e1e4f2">Bronze → Gold</text>
    <text x="370" y="210" font-size="15" fill="#8a93c4">planned</text>

    <!-- 3 Automation -->
    <circle cx="600" cy="112" r="30" fill="#151040" stroke="#9aa3c7" stroke-width="3"/>
    <text x="600" y="122" font-size="26" font-weight="700" fill="#9aa3c7">3</text>
    <text x="600" y="186" font-size="22" font-weight="700" fill="#e1e4f2">Automation</text>
    <text x="600" y="210" font-size="15" fill="#8a93c4">planned</text>

    <!-- 4 Live dashboard -->
    <circle cx="830" cy="112" r="30" fill="#151040" stroke="#9aa3c7" stroke-width="3"/>
    <text x="830" y="122" font-size="26" font-weight="700" fill="#9aa3c7">4</text>
    <text x="830" y="186" font-size="22" font-weight="700" fill="#e1e4f2">Live dashboard</text>
    <text x="830" y="210" font-size="15" fill="#8a93c4">planned</text>

    <!-- 5 Ship -->
    <circle class="goal" cx="1060" cy="112" r="30" fill="#0f3b36" stroke="#5eead4" stroke-width="3"/>
    <text x="1060" y="122" font-size="26" font-weight="700" fill="#5eead4">5</text>
    <text x="1060" y="186" font-size="22" font-weight="700" fill="#5eead4">Ship</text>
    <text x="1060" y="210" font-size="15" fill="#8a93c4">planned</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
