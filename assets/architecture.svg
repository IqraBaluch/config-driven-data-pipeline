<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .flow   { stroke-dasharray: 8 6; animation: flow 1s linear infinite; }
    .config { animation: flow 1.4s linear infinite; }
    .box    { animation: lit 6s ease-in-out infinite; }
    .b1 { animation-delay: 0s; } .b2 { animation-delay: 1.2s; } .b3 { animation-delay: 2.4s; }
    .b4 { animation-delay: 3.6s; } .b5 { animation-delay: 4.8s; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes lit  { 0%,30%,100% { stroke-opacity: .55; } 12% { stroke-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f2a"/>
      <stop offset="1" stop-color="#151040"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8a93c4"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>

  <text x="600" y="50" text-anchor="middle" font-family="'Segoe UI', Arial, 'Liberation Sans', sans-serif" font-weight="700" font-size="26" fill="#ffffff">How it works</text>

  <!-- Config: the brain -->
  <g transform="translate(430 72)">
    <rect width="340" height="56" rx="14" fill="#1a1440" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="170" y="25" text-anchor="middle" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#c4b5fd">sources.yaml</text>
    <text x="170" y="45" text-anchor="middle" font-family="'Segoe UI', Arial, 'Liberation Sans', sans-serif" font-size="14" fill="#b7bde0">metadata decides what gets ingested</text>
  </g>
  <path d="M600 128 V156 H150 V176" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 5" class="config" marker-end="url(#arrowTeal)"/>

  <g font-family="'Segoe UI', Arial, 'Liberation Sans', sans-serif" text-anchor="middle">
    <!-- Sources -->
    <rect class="box b1" x="50" y="180" width="200" height="110" rx="16" fill="#1e2a5a" stroke="#5a6aa8" stroke-width="2"/>
    <text x="150" y="222" font-size="24" font-weight="700" fill="#ffffff">Sources</text>
    <text x="150" y="250" font-size="15" fill="#c9cfe6">Binance API</text>
    <text x="150" y="272" font-size="15" fill="#c9cfe6">(more via YAML)</text>

    <!-- Bronze -->
    <rect class="box b2" x="290" y="180" width="200" height="110" rx="16" fill="#3a2716" stroke="#e0913a" stroke-width="2.5"/>
    <text x="390" y="222" font-size="24" font-weight="700" fill="#f5a54a">Bronze</text>
    <text x="390" y="250" font-size="15" fill="#ecd9c4">raw, as received</text>
    <text x="390" y="272" font-size="15" fill="#ecd9c4">Parquet, incremental</text>

    <!-- Silver -->
    <rect class="box b3" x="530" y="180" width="200" height="110" rx="16" fill="#2a2f3d" stroke="#cfd6e0" stroke-width="2.5"/>
    <text x="630" y="222" font-size="24" font-weight="700" fill="#f0f3f8">Silver</text>
    <text x="630" y="250" font-size="15" fill="#d5dae3">typed + validated</text>
    <text x="630" y="272" font-size="15" fill="#d5dae3">deduplicated</text>

    <!-- Gold -->
    <rect class="box b4" x="770" y="180" width="200" height="110" rx="16" fill="#3a3112" stroke="#f2c94c" stroke-width="2.5"/>
    <text x="870" y="222" font-size="24" font-weight="700" fill="#f7d774">Gold</text>
    <text x="870" y="250" font-size="15" fill="#efe3bd">market metrics</text>
    <text x="870" y="272" font-size="15" fill="#efe3bd">business-ready</text>

    <!-- Dashboard -->
    <rect class="box b5" x="1010" y="180" width="150" height="110" rx="16" fill="#0f3b36" stroke="#4fd1c5" stroke-width="2"/>
    <text x="1085" y="222" font-size="22" font-weight="700" fill="#5eead4">Dashboard</text>
    <text x="1085" y="250" font-size="15" fill="#c8efe9">live demo</text>
    <text x="1085" y="272" font-size="15" fill="#c8efe9">+ pipeline health</text>
  </g>

  <g stroke="#8a93c4" stroke-width="3" marker-end="url(#arrow)" class="flow">
    <line x1="252" y1="235" x2="286" y2="235"/>
    <line x1="492" y1="235" x2="526" y2="235"/>
    <line x1="732" y1="235" x2="766" y2="235"/>
    <line x1="972" y1="235" x2="1006" y2="235"/>
  </g>

  <line x1="50" y1="322" x2="1150" y2="322" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="3 6"/>
  <circle cx="150" cy="322" r="6" fill="#5eead4"/>
  <circle cx="630" cy="322" r="6" fill="#a78bfa"/>
  <circle cx="1085" cy="322" r="6" fill="#f5a54a"/>

  <g>
    <circle r="5" fill="#5eead4"><animateMotion dur="5s" repeatCount="indefinite" path="M150 322 H1085"/></circle>
    <circle r="5" fill="#f5a54a" opacity="0.9" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.7s"/><animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" path="M150 322 H1085"/></circle>
    <circle r="5" fill="#a78bfa" opacity="0.9" visibility="hidden"><set attributeName="visibility" to="visible" begin="3.4s"/><animateMotion dur="5s" begin="3.4s" repeatCount="indefinite" path="M150 322 H1085"/></circle>
  </g>
  <text x="600" y="354" text-anchor="middle" font-family="Consolas, 'Courier New', 'DejaVu Sans Mono', monospace" font-size="15" fill="#8a93c4">Python · DuckDB · Parquet · runs hourly on GitHub Actions · audited and documented</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
